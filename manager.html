<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>盤點總召管理頁</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f5f6f8;color:#222}
.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 2px 14px #0000000d}
h1{margin:0 0 6px;font-size:28px}.sub{color:#666;font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:#f7f9fc;padding:16px;border-radius:14px}.stat b{display:block;font-size:28px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#1769e0;color:white}.green{background:#15803d;color:white}.light{background:#edf1f5;color:#222}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:14px}th{white-space:nowrap}
.ok{color:#15803d}.err{color:#b42318}.msg{margin-top:10px;min-height:20px}.detail{display:none;margin-top:10px;background:#f8fafc;border-radius:12px;padding:10px;overflow:auto}
.detail table{min-width:760px}.small{font-size:12px;color:#777}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.card{padding:14px}table.main th:nth-child(2),table.main td:nth-child(2){display:none}}
.boxchip{padding:10px 6px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;border:1px solid #ddd}.boxdone{background:#e8f7ed;color:#126b35;border-color:#bde4c9}.boxmissing{background:#fdecec;color:#a61b1b;border-color:#f2bcbc}.boxunused{background:#fff6d8;color:#795500;border-color:#efd98d}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📊 盤點總召管理頁</h1>
    <div class="sub">自動讀取 Firestore 的 inventorySubmissions 雲端盤點資料。</div>
    <div class="stats">
      <div class="stat">已提交人次<b id="people">0</b></div>
      <div class="stat">總箱數<b id="boxes">0</b></div>
      <div class="stat">總品項<b id="skus">0</b></div>
      <div class="stat">總件數<b id="qty">0</b></div>
    </div>
  </div>


  <div class="card">
    <h2 style="margin-top:0">📦 全場箱號進度</h2>
    <div class="sub">設定本場可能使用的箱號範圍。未上傳的箱號會列出；未使用的貼紙可由總召標記。</div>
    <div class="row" style="margin-top:10px">
      <input id="rangeStart" type="number" min="1" value="1" style="max-width:120px;border:1px solid #d8dce2;border-radius:12px;padding:11px" placeholder="起始">
      <input id="rangeEnd" type="number" min="1" value="100" style="max-width:120px;border:1px solid #d8dce2;border-radius:12px;padding:11px" placeholder="結束">
      <button class="btn primary" onclick="renderBoxBoard()">更新進度</button>
    </div>
    <div id="boxSummary" class="msg"></div>
    <div id="boxBoard" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px"></div>
  </div>
  <div class="card">
    <div class="row">
      <button class="btn primary" onclick="loadData()">🔄 重新整理</button>
      <button class="btn green" onclick="exportAll()">⬇ 匯出全部盤點 Excel</button>
      <button class="btn light" style="color:#b42318" onclick="clearCloudAll()">🗑️ 清空全部雲端盤點</button>
    </div>
    <div id="msg" class="msg">正在讀取雲端資料…</div>
    <div style="overflow:auto">
      <table class="main">
        <thead><tr><th>盤點人員</th><th>區域／櫃點</th><th>箱數</th><th>品項</th><th>總件數</th><th>提交時間</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="small" style="text-align:center;padding:8px">Powered by TINA</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUMVSVZdXjq1KVPNnIT63A003iEM3m3n0",
  authDomain: "animation-inventory.firebaseapp.com",
  projectId: "animation-inventory",
  storageBucket: "animation-inventory.firebasestorage.app",
  messagingSenderId: "1079737097831",
  appId: "1:1079737097831:web:84ee8ff6b74a81d8553ec2",
  measurementId: "G-F02FSJGPGT"
};
const app=initializeApp(firebaseConfig), db=getFirestore(app);
let submissions=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function when(d){
  if(d?.submittedAt?.toDate) return d.submittedAt.toDate().toLocaleString('zh-TW',{hour12:false});
  if(d?.submittedAtLocal) return new Date(d.submittedAtLocal).toLocaleString('zh-TW',{hour12:false});
  return '';
}
window.toggleDetail=(id)=>{const e=document.getElementById('d-'+id);e.style.display=e.style.display==='block'?'none':'block'};

window.loadData=async function(){
 const msg=document.getElementById('msg'); msg.textContent='正在讀取雲端資料…'; msg.className='msg';
 try{
   let snap;
   try{ snap=await getDocs(query(collection(db,'inventorySubmissions'),orderBy('submittedAt','desc'))); }
   catch(e){ snap=await getDocs(collection(db,'inventorySubmissions')); }
   submissions=snap.docs.map(x=>({id:x.id,...x.data()}));
   submissions.sort((a,b)=>{
     const ta=a.submittedAt?.seconds || Date.parse(a.submittedAtLocal||0)/1000 || 0;
     const tb=b.submittedAt?.seconds || Date.parse(b.submittedAtLocal||0)/1000 || 0;
     return tb-ta;
   });
   render();
   renderBoxBoard();
   msg.textContent='✅ 已讀取 '+submissions.length+' 筆雲端提交資料'; msg.className='msg ok';
 }catch(e){
   console.error(e); msg.textContent='❌ 無法讀取 Firestore：'+(e.message||e); msg.className='msg err';
 }
}

function render(){
 document.getElementById('people').textContent=submissions.length;
 document.getElementById('boxes').textContent=submissions.reduce((s,d)=>s+(Number(d.boxCount)||0),0);
 document.getElementById('skus').textContent=submissions.reduce((s,d)=>s+(Number(d.skuCount)||0),0);
 document.getElementById('qty').textContent=submissions.reduce((s,d)=>s+(Number(d.totalCount)||0),0);
 const tb=document.getElementById('tbody'); tb.innerHTML='';
 submissions.forEach(d=>{
   const tr=document.createElement('tr');
   const dupCount=submissions.filter(x=>(x.operator||'').trim()===(d.operator||'').trim() && (x.area||'').trim()===(d.area||'').trim()).length;
   const status=dupCount>1?`<span style="color:#b42318;font-weight:700">⚠️ 可能重複 ×${dupCount}</span>`:`<span class="ok">正常</span>`;
   tr.innerHTML=`<td><b>${esc(d.operator||'')}</b></td><td>${esc(d.area||'')}</td><td>${d.boxCount||0}</td><td>${d.skuCount||0}</td><td>${d.totalCount||0}</td><td>${esc(when(d))}</td><td>${status}</td><td><button class="btn light" onclick="toggleDetail('${d.id}')">查看</button> <button class="btn light" style="color:#b42318" onclick="deleteSubmission('${d.id}','${esc(d.operator||'')}')">🗑️ 刪除</button></td>`;
   tb.appendChild(tr);
   const tr2=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=8;
   const items=Array.isArray(d.items)?d.items:[];
   td.innerHTML=`<div class="detail" id="d-${d.id}"><b>${esc(d.operator||'')}｜${esc(d.area||'')}｜文件編號 ${esc(d.id)}</b>
   <table><thead><tr><th>箱號</th><th>條碼</th><th>品號</th><th>品名</th><th>規格</th><th>數量</th></tr></thead>
   <tbody>${items.map(v=>`<tr><td>${v.boxNo||''}</td><td>${esc(v.barcode||'')}</td><td>${esc(v.productNo||'')}</td><td>${esc(v.productName||'')}</td><td>${esc(v.spec||'')}</td><td>${v.qty||0}</td></tr>`).join('')}</tbody></table></div>`;
   tr2.appendChild(td); tb.appendChild(tr2);
 });
}


window.deleteSubmission=async function(id, operator){
  if(!confirm('確定要刪除「'+operator+'」這筆雲端盤點嗎？\n\n刪除後無法從總召頁復原。')) return;
  const typed=prompt('為避免誤刪，請輸入：刪除');
  if(typed!=='刪除') return alert('已取消刪除');
  try{
    await deleteDoc(doc(db,'inventorySubmissions',id));
    alert('✅ 已刪除這筆雲端盤點');
    await document.getElementById('rangeStart').value=localStorage.getItem('managerBoxStart')||'1';
document.getElementById('rangeEnd').value=localStorage.getItem('managerBoxEnd')||'100';
window.loadData();
  }catch(e){
    alert('刪除失敗：'+(e.message||e));
  }
};

window.clearCloudAll=async function(){
  if(!submissions.length) return alert('目前沒有雲端盤點資料');
  if(!confirm('⚠️ 即將刪除目前全部 '+submissions.length+' 筆雲端盤點。\n\n這個動作無法復原，確定要繼續嗎？')) return;
  const typed=prompt('最後確認：請輸入「全部清空」');
  if(typed!=='全部清空') return alert('已取消清空');
  try{
    for(let i=0;i<submissions.length;i+=400){
      const batch=writeBatch(db);
      submissions.slice(i,i+400).forEach(d=>batch.delete(doc(db,'inventorySubmissions',d.id)));
      await batch.commit();
    }
    alert('✅ 雲端盤點資料已全部清空');
    await window.loadData();
  }catch(e){
    alert('清空失敗：'+(e.message||e));
  }
};


function usedBoxMap(){
  const map=new Map();
  submissions.forEach(d=>{
    (Array.isArray(d.boxNumbers)?d.boxNumbers:[]).forEach(b=>{
      b=Number(b); if(!map.has(b))map.set(b,[]);
      map.get(b).push(d);
    });
  });
  return map;
}
window.renderBoxBoard=function(){
  const a=Math.max(1,parseInt(document.getElementById('rangeStart').value)||1);
  const z=Math.max(a,parseInt(document.getElementById('rangeEnd').value)||100);
  localStorage.setItem('managerBoxStart',String(a));localStorage.setItem('managerBoxEnd',String(z));
  const unused=new Set(JSON.parse(localStorage.getItem('managerUnusedBoxes')||'[]').map(Number));
  const map=usedBoxMap(), board=document.getElementById('boxBoard');
  let done=0,missing=0,un=0,duplicate=[];
  board.innerHTML='';
  for(let b=a;b<=z;b++){
    const ds=map.get(b)||[];
    const e=document.createElement('div');
    if(ds.length){done++; if(ds.length>1)duplicate.push(b); e.className='boxchip boxdone'; e.innerHTML='箱 '+b+'<br>🟢 已上傳'+(ds.length>1?'<br>⚠️ 重複':''); e.title=ds.map(x=>(x.operator||'')+'｜'+(x.area||'')).join('\n');}
    else if(unused.has(b)){un++;e.className='boxchip boxunused';e.innerHTML='箱 '+b+'<br>🟡 未使用';}
    else{missing++;e.className='boxchip boxmissing';e.innerHTML='箱 '+b+'<br>🔴 未收到';}
    e.onclick=()=>{
      if(ds.length){alert('第 '+b+' 箱已上傳：\n\n'+ds.map(x=>(x.operator||'')+'｜'+(x.area||'')+'｜'+when(x)).join('\n'));return;}
      const set=new Set(JSON.parse(localStorage.getItem('managerUnusedBoxes')||'[]').map(Number));
      if(set.has(b))set.delete(b);else set.add(b);
      localStorage.setItem('managerUnusedBoxes',JSON.stringify([...set]));
      renderBoxBoard();
    };
    board.appendChild(e);
  }
  document.getElementById('boxSummary').innerHTML='🟢 已上傳 <b>'+done+'</b> 箱　🟡 未使用 <b>'+un+'</b> 箱　🔴 尚未收到 <b>'+missing+'</b> 箱'+(duplicate.length?'　⚠️ 重複箱號：<b>'+duplicate.join('、')+'</b>':'');
}
window.exportAll=function(){
 if(!submissions.length) return alert('目前沒有可匯出的雲端資料');
 const rows=[];
 submissions.forEach(d=>{
   (Array.isArray(d.items)?d.items:[]).forEach(v=>rows.push({
     "盤點人員":d.operator||"","盤點區域/櫃點":d.area||"","箱號":v.boxNo||"",
     "條碼":v.barcode||"","品號":v.productNo||"","品名":v.productName||"",
     "規格":v.spec||"","貨號":v.itemNo||"","零售價":v.retailPrice||"",
     "數量":Number(v.qty)||0,"提交時間":when(d),"雲端文件編號":d.id
   }));
 });
 const summary=submissions.map(d=>({
   "盤點人員":d.operator||"","盤點區域/櫃點":d.area||"","箱數":d.boxCount||0,
   "品項":d.skuCount||0,"總件數":d.totalCount||0,"提交時間":when(d),"雲端文件編號":d.id
 }));
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"全部盤點明細");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),"提交總表");
 const now=new Date(), p=n=>String(n).padStart(2,'0');
 const fn=`總盤點_${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.xlsx`;
 XLSX.writeFile(wb,fn);
}
window.loadData();
</script>
</body></html>
